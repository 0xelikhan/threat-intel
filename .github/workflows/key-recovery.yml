name: One-time key recovery (encrypted)

# Exports the Container App's secrets, env vars and data/config.json,
# encrypted to an RSA public key whose private half never leaves the
# owner's machine. Nothing readable is written to the log or artifact.
# Delete this workflow after use.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: threat-intel-rg
  APP_NAME:       threat-intel-platform

jobs:
  export:
    if: github.actor == '0xelikhan'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Collect and encrypt
        run: |
          set -uo pipefail
          umask 077
          W=$(mktemp -d)
          mkdir -p out

          cat > "$W/pub.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAtSl4fr/hOb13rkfPsMyo
          1LEMGgPLue4ppVT8EwAHvgAnOwP/bvqOiAw6YGVnDCeTsNNj3d0oRY8ZTNY6B811
          ZLiFZHcFR+lNVmBSN8lfhDR9mBt50Vwzab/QTrNmAhkqEDxMmsb4gKhozDLTD0k4
          w15uEughs1gY7fjq0h8IY5q7l6f+h23RnRLkQLEmfBV4+tYT4WRqqdqDf6qLRgeT
          gzaCaBg9KIbVm+jFIJobXD4S4X9YEH5hV4oqMnnwQxc6qc3WygHpeDel+Wcq/NBx
          /+pMx3ijQj+2v710A/FSgBRmjlISLligICvun52xz1KbR24ljvBEtNSITsw2MGEx
          HfOf8SMeeL7PwQWfvWzvO66kygbPSh7qQkhzk+ZZFGCsnU8mlPGBprVbDKA/b/Vv
          tGlQ01lvKoScE3SGU0NWI0H45gkJRmcPbdkwL/AHvZIYyRMoMpN4rlUGAtpSXaKS
          boZVGJHpeoNQDevMOVnK7FgxJNl0lCpODDvYhnWeInUO6OdbyKLf8x09PEpzyv1m
          qlXNrRaC8DwA4/sAFQQ+DQxnCAq5HLWwsWTtpeeBOUtrsZRho3tLbLoaORS1JNsD
          qNKdsQHz5lpdQqgx5XZZCNqIO62yPTqJCX7mpCTLj7LWKxlmKwVL6j7pV1MqIo2M
          qtSpFKISUM5sr2LxuaVQgusCAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          sed -i 's/^ *//' "$W/pub.pem"

          # Container App secrets (values) and container env vars
          az containerapp secret list -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --show-values -o json > "$W/secrets.json" 2> "$W/secrets.err" \
            || echo '[]' > "$W/secrets.json"
          az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --query "{containers: properties.template.containers[].{name:name, env:env, volumeMounts:volumeMounts}, volumes: properties.template.volumes}" \
            -o json > "$W/app.json" 2> "$W/app.err" || echo '{}' > "$W/app.json"

          # data/config.json inside the running container (keys saved through the app)
          timeout 90 az containerapp exec -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --command "cat /app/data/config.json" < /dev/null > "$W/config.raw" 2> "$W/exec.err" || true

          # Key Vaults in the resource group, if any
          echo '{}' > "$W/kv.json"
          for kv in $(az keyvault list -g "$RESOURCE_GROUP" --query "[].name" -o tsv 2>/dev/null); do
            for s in $(az keyvault secret list --vault-name "$kv" --query "[].name" -o tsv 2>/dev/null); do
              v=$(az keyvault secret show --vault-name "$kv" -n "$s" --query value -o tsv 2>/dev/null || true)
              jq --arg k "$kv/$s" --arg v "$v" '. + {($k): $v}' "$W/kv.json" > "$W/kv.tmp" && mv "$W/kv.tmp" "$W/kv.json"
            done
          done

          jq -n \
            --slurpfile secrets "$W/secrets.json" \
            --slurpfile app "$W/app.json" \
            --slurpfile kv "$W/kv.json" \
            --rawfile config "$W/config.raw" \
            '{secrets: $secrets[0], app: $app[0], keyvault: $kv[0], config_json_raw: $config}' \
            > "$W/export.json"

          # Hybrid encryption: random AES key, wrapped with the RSA public key
          openssl rand -hex 32 > "$W/aes.key"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$W/export.json" -out out/export.json.enc -pass file:"$W/aes.key"
          openssl pkeyutl -encrypt -pubin -inkey "$W/pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$W/aes.key" -out out/aes.key.enc

          # Counts only, never values
          echo "secrets found:       $(jq 'length' "$W/secrets.json")"
          echo "env vars found:      $(jq '[.containers[]?.env[]?] | length' "$W/app.json")"
          echo "volumes attached:    $(jq '.volumes | length' "$W/app.json")"
          echo "config.json bytes:   $(wc -c < "$W/config.raw")"
          echo "key vault secrets:   $(jq 'length' "$W/kv.json")"
          [ -s "$W/secrets.err" ] && echo "secret list failed (permission?)"
          [ -s "$W/app.err" ] && echo "app show failed (permission?)"

          shred -u "$W"/* 2>/dev/null || rm -rf "$W"

      - name: Upload encrypted export
        uses: actions/upload-artifact@v4
        with:
          name: key-recovery
          path: out/
          retention-days: 1
