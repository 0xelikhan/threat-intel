name: Deploy to Azure Container Apps

# NOTE: this lives at the REPO ROOT (.github/workflows/) — GitHub Actions only
# discovers workflows there, never inside a subdirectory. The application lives
# under threat-intel-app/, so every path below is prefixed accordingly.

on:
  push:
    branches: [main]
    paths:
      - 'threat-intel-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:        # manual trigger from the Actions tab

env:
  RESOURCE_GROUP: threat-intel-rg
  APP_NAME:       threat-intel-platform
  IMAGE_NAME:     threat-intel-platform
  # ACR_NAME + AZURE_CREDENTIALS are repository secrets

jobs:
  build-and-deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Container Apps deploys fail hard if these resource providers aren't
      # registered on the subscription (this broke a prior run). Registration is
      # idempotent and returns immediately when already registered, so it's safe
      # to run every deploy — it self-heals if a provider ever gets dropped.
      - name: Ensure required resource providers are registered
        run: |
          az provider register -n Microsoft.App --wait
          az provider register -n Microsoft.OperationalInsights --wait

      # Build in the cloud (ACR Tasks) — no Docker needed on the runner. The
      # build context is the threat-intel-app folder; the Dockerfile builds the
      # React frontend and Python backend in one multi-stage image.
      - name: Build and push image (ACR build)
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image ${IMAGE_NAME}:${{ github.sha }} \
            --image ${IMAGE_NAME}:latest \
            --file threat-intel-app/Dockerfile \
            threat-intel-app

      - name: Deploy to Azure Container Apps
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name ${{ secrets.ACR_NAME }} --query loginServer -o tsv)
          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} \
            --image ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }} \
            --output none

          APP_URL=$(az containerapp show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "APP_URL=https://$APP_URL" >> $GITHUB_ENV
          echo "Deployed to: https://$APP_URL"

      - name: Verify deployment health
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.APP_URL }}/api/health)
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed (HTTP $STATUS)"
          else
            echo "Health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ env.APP_URL }}" >> $GITHUB_STEP_SUMMARY
