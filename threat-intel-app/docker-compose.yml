version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threat-intel-platform
    ports:
      - "8000:8000"
    volumes:
      # Persist API key config and analysis history across restarts
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
