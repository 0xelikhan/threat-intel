name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:    # allows manual trigger from GitHub UI

env:
  RESOURCE_GROUP: threat-intel-rg
  APP_NAME:       threat-intel-platform
  # ACR_NAME is set as a GitHub secret

jobs:
  build-and-deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node for frontend build ────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Build React frontend ───────────────────────────────────────────────
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── 4. Login to Azure ─────────────────────────────────────────────────────
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 5. Login to ACR ───────────────────────────────────────────────────────
      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # ── 6. Build and push Docker image ───────────────────────────────────────
      - name: Build and push image
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name ${{ secrets.ACR_NAME }} --query loginServer -o tsv)
          IMAGE_TAG="${ACR_LOGIN_SERVER}/threat-intel-platform:${{ github.sha }}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/threat-intel-platform:latest"

          docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
          docker push $IMAGE_TAG
          docker push $IMAGE_LATEST

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV

      # ── 7. Deploy to Container Apps ───────────────────────────────────────────
      - name: Deploy to Azure Container Apps
        run: |
          ACR_PASSWORD=$(az acr credential show --name ${{ secrets.ACR_NAME }} --query "passwords[0].value" -o tsv)

          az containerapp update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} \
            --image ${{ env.IMAGE_TAG }} \
            --output none

          APP_URL=$(az containerapp show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "✓ Deployed to: https://$APP_URL"
          echo "APP_URL=https://$APP_URL" >> $GITHUB_ENV

      # ── 8. Verify deployment ──────────────────────────────────────────────────
      - name: Verify deployment health
        run: |
          sleep 30   # wait for container to start
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.APP_URL }}/api/health)
          if [ "$STATUS" = "200" ]; then
            echo "✓ Health check passed (HTTP $STATUS)"
          else
            echo "✗ Health check failed (HTTP $STATUS)"
            exit 1
          fi

      # ── 9. Notify on failure ──────────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ env.APP_URL }}" >> $GITHUB_STEP_SUMMARY
