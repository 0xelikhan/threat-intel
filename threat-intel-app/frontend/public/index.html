<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#060b1c" />
    <title>RECON</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Fonts bundled via @fontsource/inter + @fontsource/jetbrains-mono in index.js -->
    <style>
      /* First-paint styles. The React app replaces these via MUI CssBaseline
         + index.css; these just prevent a white flash before React mounts. */
      *,*::before,*::after { box-sizing: border-box; }
      html,body { margin: 0; padding: 0; }
      body {
        background: linear-gradient(#060b1c 0%, #0a1628 40%, #0d1b2a 100%);
        min-height: 100vh;
        color: #e6edf3;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      code,pre,kbd { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SF Mono', Consolas, monospace; }
      #root { min-height: 100vh; }
      ::selection { background: rgba(0,229,255,0.28); color: #fff; }
    </style>
  </head>
  <body>
    <noscript>RECON requires JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
